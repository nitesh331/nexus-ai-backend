services:
  - type: web
    name: nexus-ai-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434/v1
      - key: OLLAMA_MODEL
        value: llama3.2
    healthCheckPath: /api/network-status