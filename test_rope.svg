  </defs>

  <path d="M -15 25 h 35 c 15 0, 15 -10, 30 -10 c 15 0, 15 20, 0 20 c -15 0, -15 -20, -30 -20 c -15 0, -15 20, 0 20 c 15 0, 15 -10, 30 -10 h 35"
        fill="none" stroke="url(#rope-pattern)" stroke-width="6" stroke-linecap="round" filter="url(#shadow)" />
