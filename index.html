    <link rel="canonical" href="https://nexusai.app/" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexus AI" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus AI" />

    <!-- Discovery -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Schema.org WebApplication Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nexus AI",
        "url": "https://nexusai.app/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "All",
        "description": "A modern, premium AI assistant featuring multi-mode workspaces, AI Companion with 3D voice visualizer, debate partner, and interactive voice-to-voice calling.",
        "featureList": [
          "Multi-Workspace AI (Chat, Deep Search, Web Design, Notes Maker, Media Studio)",
          "Real-time Web Search Intelligence & 3D Interactive Globe",
          "AI Voice Companion with 3D Liquid Waveform Visualizer",
          "Interactive Voice-to-Voice Audio Calling",
          "Temporary Chat Privacy Mode with Auto-Purge",
          "Academic Notes Synthesis with One-Click PDF Export"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Schema.org FAQPage Structured Data for Rich Search Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I start a new chat in Nexus AI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Click the 'New chat' button in the top right corner of the header. This will clear the current workspace context and let you start fresh."
            }
          },
          {
            "@type": "Question",
            "name": "What is the Smart Prompt Enhancer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Smart Prompt Enhancer automatically rewrites short or simple prompts into highly detailed, effective instructions before sending them to generate superior AI responses."
            }
          },
          {
            "@type": "Question",
            "name": "What is Temporary Chat mode?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "When Temporary Chat mode is enabled in Settings > Data Controls, your conversation history is stored strictly in session memory while the web app remains open. Once the tab or browser is closed, all temporary chats are automatically purged."
            }
          },
          {
            "@type": "Question",
            "name": "Are my chats saved permanently by default?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, by default your chats are saved securely on your local device for each workspace, allowing you to access recent chats or manually delete them whenever you wish."
            }
          }
        ]
      }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
