<svg viewBox="-15 10 100 30" xmlns="http://www.w3.org/2000/svg" style="background:#222">
  <defs>
    <!-- Organic fibrous texture -->
    <filter id="natural-rope">
      <!-- Create fiber noise -->
      <feTurbulence type="fractalNoise" baseFrequency="0.2 0.8" numOctaves="4" result="fibers" />
      
      <!-- Displace the edges slightly to make them fuzzy -->
      <feDisplacementMap in="SourceGraphic" in2="fibers" scale="2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      
      <!-- Add a bump map lighting for 3D realism without looking plastic -->
      <feDiffuseLighting in="fibers" surfaceScale="2" diffuseConstant="1" lighting-color="#eedcba" result="light">
        <fePointLight x="50" y="0" z="50" />
      </feDiffuseLighting>
      
      <!-- Multiply the lighting over the displaced stroke -->
      <feComposite operator="arithmetic" k1="1" k2="0" k3="0" k4="0" in="light" in2="displaced" result="textured" />
      
      <!-- Shadow -->
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base twisted look via dasharray, but filtered through the organic fiber filter -->
  <g filter="url(#natural-rope)">
    <path d="M -15 25 h 35 c 15 0, 15 -10, 30 -10 c 15 0, 15 20, 0 20 c -15 0, -15 -20, -30 -20 c -15 0, -15 20, 0 20 c 15 0, 15 -10, 30 -10 h 35"
          fill="none" stroke="#D4A373" stroke-width="8" stroke-linecap="round" />
          
    <path d="M -15 25 h 35 c 15 0, 15 -10, 30 -10 c 15 0, 15 20, 0 20 c -15 0, -15 -20, -30 -20 c -15 0, -15 20, 0 20 c 15 0, 15 -10, 30 -10 h 35"
          fill="none" stroke="#5C3A21" stroke-width="8" stroke-dasharray="2 4" stroke-linecap="round" />
  </g>
</svg>
