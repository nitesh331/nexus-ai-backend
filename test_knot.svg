<svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg" style="background: #222;">
  <defs>
    <filter id="rope-texture" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Generate noise -->
      <feTurbulence type="fractalNoise" baseFrequency="0.5 0.05" numOctaves="3" result="noise" />
      <!-- Displace the base shape -->
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <!-- Add a slight drop shadow -->
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#rope-texture)">
    <path d="M 5,20 C 15,20 20,5 30,5 C 40,5 45,35 55,35 C 65,35 70,5 80,5 C 90,5 95,20 105,20" 
          fill="none" stroke="#D4A373" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
